Resources:
  # ingesta -> bronze -> silver -> gold -> models -> tablero -> expand -> crawler. Each Glue stage retries
  # once, and any failure publishes the error to SNS before failing.
  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ${self:custom.prefix}-pipeline
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionString: |
        {
          "Comment": "Pipeline batch del RUNT: vehiculos en siniestros con victimas",
          "StartAt": "Ingesta",
          "States": {
            "Ingesta": {
              "Comment": "Downloads the dataset from datos.gov.co into raw/ and validates it. If validation fails, raw/ is not replaced and the pipeline stops.",
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-ingesta" },
              "ResultPath": null,
              "TimeoutSeconds": 1800,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Bronze"
            },
            "Bronze": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-bronze" },
              "ResultPath": null,
              "TimeoutSeconds": 3600,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Silver"
            },
            "Silver": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-silver" },
              "ResultPath": null,
              "TimeoutSeconds": 3600,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Gold"
            },
            "Gold": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-gold" },
              "ResultPath": null,
              "TimeoutSeconds": 3600,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Models"
            },
            "Models": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-models" },
              "ResultPath": null,
              "TimeoutSeconds": 3600,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Tablero"
            },
            "Tablero": {
              "Comment": "Writes gold/tablero/datos.json, the data the API serves to the web dashboard.",
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-tablero" },
              "ResultPath": null,
              "TimeoutSeconds": 1200,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Expand"
            },
            "Expand": {
              "Comment": "Synthetic volume test: gold/vehiculos_expandido with at least one million rows. The model and the dashboard never read it.",
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": { "JobName": "${self:custom.prefix}-expand" },
              "ResultPath": null,
              "TimeoutSeconds": 1200,
              "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 1 }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure" }],
              "Next": "Catalog"
            },
            "Catalog": {
              "Comment": "Starts the crawler without waiting. If it is already running the data is still fine, so it does not fail the pipeline.",
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
              "Parameters": { "Name": "${self:custom.prefix}-crawler" },
              "ResultPath": null,
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.crawlerError", "Next": "NotifySuccess" }],
              "Next": "NotifySuccess"
            },
            "NotifySuccess": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${AlertsTopic}",
                "Subject": "Pipeline accidentes-runt: OK",
                "Message": "El pipeline termino: ingesta, bronze, silver, gold, modelos, datos del tablero y tabla sintetica actualizados."
              },
              "ResultPath": null,
              "End": true
            },
            "NotifyFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${AlertsTopic}",
                "Subject": "Pipeline accidentes-runt: FALLO",
                "Message.$": "States.JsonToString($.error)"
              },
              "ResultPath": null,
              "Next": "PipelineFailed"
            },
            "PipelineFailed": {
              "Type": "Fail",
              "Error": "PipelineFailed",
              "Cause": "Una etapa de Glue fallo despues de su reintento. Revisa el error en NotifyFailure y los logs en /aws-glue/jobs/error."
            }
          }
        }
      DefinitionSubstitutions:
        AlertsTopic: !Ref AlertsTopic
