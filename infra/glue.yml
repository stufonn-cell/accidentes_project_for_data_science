Resources:
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: ${self:custom.databaseName}
        Description: Vehiculos en siniestros con victimas (RUNT), capas silver y gold

  # Registers silver and every gold table in the catalog, so Athena can
  # query them. One target per table folder: the crawler names each table
  # after its folder (vehiculos, municipio_mes, metricas, ...). silver and
  # gold both have a vehiculos folder; the crawler keeps both, adding a
  # suffix to the second one.
  LakeCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: ${self:custom.prefix}-crawler
      Role: !GetAtt GlueJobRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: s3://${self:custom.bucketName}/silver/vehiculos/
          - Path: s3://${self:custom.bucketName}/gold/vehiculos/
          - Path: s3://${self:custom.bucketName}/gold/vehiculos_expandido/
          - Path: s3://${self:custom.bucketName}/gold/municipio_mes/
          - Path: s3://${self:custom.bucketName}/gold/municipio/
          - Path: s3://${self:custom.bucketName}/gold/modelos/metricas/
          - Path: s3://${self:custom.bucketName}/gold/modelos/predicciones/
          - Path: s3://${self:custom.bucketName}/gold/modelos/grupos/
          - Path: s3://${self:custom.bucketName}/gold/modelos/letalidad/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: DEPRECATE_IN_DATABASE

  # Ingestion: downloads the dataset from datos.gov.co into raw/ and validates
  # it. A Python shell job (1/16 of a DPU): downloading 50 MB needs no Spark.
  # The script is src/ingesta.py, uploaded as it is by deploy.sh.
  IngestaJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-ingesta
      Role: !GetAtt GlueJobRole.Arn
      MaxCapacity: 0.0625
      Timeout: 30
      MaxRetries: 0
      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/ingesta.py
      DefaultArguments:
        --data_dir: s3://${self:custom.bucketName}

  # One Glue job per stage. All of them run glue_jobs/run_stage.py with
  # a different --stage, on the smallest Spark size (2 workers G.1X). Every
  # stage runs the pandas module of src on the driver (450 thousand rows
  # fit in memory); distributed Spark processing is a pending item.
  BronzeJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-bronze
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 60
      MaxRetries: 0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/run_stage.py
      DefaultArguments:
        --job-language: python
        --TempDir: s3://${self:custom.bucketName}/tmp/
        --extra-py-files: s3://${self:custom.bucketName}/scripts/src.zip
        --additional-python-modules: ${self:custom.pythonModules}
        --data_dir: s3://${self:custom.bucketName}
        --stage: bronze

  SilverJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-silver
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 60
      MaxRetries: 0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/run_stage.py
      DefaultArguments:
        --job-language: python
        --TempDir: s3://${self:custom.bucketName}/tmp/
        --extra-py-files: s3://${self:custom.bucketName}/scripts/src.zip
        --additional-python-modules: ${self:custom.pythonModules}
        --data_dir: s3://${self:custom.bucketName}
        --stage: silver

  GoldJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-gold
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 60
      MaxRetries: 0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/run_stage.py
      DefaultArguments:
        --job-language: python
        --TempDir: s3://${self:custom.bucketName}/tmp/
        --extra-py-files: s3://${self:custom.bucketName}/scripts/src.zip
        --additional-python-modules: ${self:custom.pythonModules}
        --data_dir: s3://${self:custom.bucketName}
        --stage: gold

  ModelsJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-models
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 60
      MaxRetries: 0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/run_stage.py
      DefaultArguments:
        --job-language: python
        --TempDir: s3://${self:custom.bucketName}/tmp/
        --extra-py-files: s3://${self:custom.bucketName}/scripts/src.zip
        --additional-python-modules: ${self:custom.pythonModules}
        --data_dir: s3://${self:custom.bucketName}
        --stage: models

  # Dashboard data: one JSON document in gold/tablero/ that the API serves.
  TableroJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-tablero
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 20
      MaxRetries: 0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/run_stage.py
      DefaultArguments:
        --job-language: python
        --TempDir: s3://${self:custom.bucketName}/tmp/
        --extra-py-files: s3://${self:custom.bucketName}/scripts/src.zip
        --additional-python-modules: ${self:custom.pythonModules}
        --data_dir: s3://${self:custom.bucketName}
        --stage: tablero

  # Synthetic volume: gold/vehiculos_expandido, at least one million rows
  # (real rows plus month-shifted copies). Never read by the model.
  ExpandJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.prefix}-expand
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 20
      MaxRetries: 0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: s3://${self:custom.bucketName}/scripts/run_stage.py
      DefaultArguments:
        --job-language: python
        --TempDir: s3://${self:custom.bucketName}/tmp/
        --extra-py-files: s3://${self:custom.bucketName}/scripts/src.zip
        --additional-python-modules: ${self:custom.pythonModules}
        --data_dir: s3://${self:custom.bucketName}
        --stage: expand
